# prefix keybind
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Window Index
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# vi mode
set-window-option -g mode-keys vi

# buffer size
set-option -g history-limit 10000

# read conf
unbind r
bind r source-file ~/.tmux.conf

# split
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

#### PANE NAVIGATION ####
bind j select-pane -D
bind k select-pane -U
bind h select-pane -L
bind l select-pane -R

# pane size
bind C-j resize-pane -D
bind C-k resize-pane -U
bind C-h resize-pane -L
bind C-g resize-pane -L
bind C-l resize-pane -R

#### CLIPBORD ####
bind y run-shell 'tmux save-buffer - | reattach-to-user-namespace pbcopy'

#### ZOOM PANE ####
bind C-o run "/bin/bash -c 'if [ -f $HOME/.tmux/zoomwin.sh ]; then bash ~/.tmux/zoomwin.sh; else tmux resize-pane -Z; fi'"

# for 2.1+
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" \
                                     "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

#### STATUS LINE (claude code usage) ####
set -g status-interval 30
set -g status-right '#(~/work/tmux-tips/bin/tmux-rate-limits)'
set -g status-right-length 100

#### COLOURS ####

# default statusbar colors
set-option -g status-bg colour235 #base02
set-option -g status-fg colour136 #yellow
# set-option -g status-attr default

# default window title colors
# set-window-option -g window-status-fg colour244
# set-window-option -g window-status-bg default
# set-window-option -g window-status-attr dim

# active window title colors
# set-window-option -g window-status-current-fg colour166 #orange
# set-window-option -g window-status-current-bg default
# set-window-option -g window-status-current-attr bright

# pane border
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=black#,bg=green#,bold] #{?#{@claude-state},#{@claude-state},#T} #[default], #{?#{@claude-state},#{@claude-state},#T} }"
# set-option -g pane-border-fg default
# set-option -g pane-active-border-fg default

# message text
# set-option -g message-bg colour235 #base02
# set-option -g message-fg colour166 #orange

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

#### Powerline ####
set -g default-terminal "screen-256color"
# source "/usr/share/powerline/bindings/tmux/powerline.conf"

## highlight active window
setw -g window-active-style 'bg=#181a1e'

## active window title color
set-window-option -g window-status-current-style fg=brightred,bg=colour236,bright

## copy for mac
set -s copy-command 'pbcopy'

####################
### TMUX plugins ###
####################
run-shell ~/work/tmux-tips/tmux-watch.tmux
run-shell ~/work/tmux-tips/mob-navigator.tmux
run-shell ~/work/tmux-tips/diff-pane.tmux
