onboarding = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
pane_gaps = false

[theme]
name = "dracula"
auto_switch = false

[keys]
prefix = "ctrl+a"

[ui.toast]
delivery = "system"

[experimental]
switch_ascii_input_source_in_prefix = true
# Local Kitty graphics rendering for attached clients.
# Requires a Kitty graphics-compatible outer terminal.
kitty_graphics = true

# Show the Claude Code session title (written by Claude Code as the terminal
# title, captured by herdr) in the agent panel rows for claude panes.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], [{ token = "terminal_title_stripped", dim = false }], ["agent"]]
